  - id: existing_code_keeps_its_behavior
    prompt: |
      turn this into a proper project (create_coding_project):

      ```js
      // dedupe.js: drop rows with a repeated email, keep the first one
      const fs = require("fs");
      const [, , input, output] = process.argv;
      const lines = fs.readFileSync(input, "utf8").split("\n").filter(Boolean);
      const header = lines.shift();
      const idx = header.split(",").indexOf("email");
      const seen = new Set();
      const kept = [header];
      for (const line of lines) {
        const email = line.split(",")[idx].trim().toLowerCase();
        if (seen.has(email)) continue;
        seen.add(email);
        kept.push(line);
      }
      fs.writeFileSync(output, kept.join("\n") + "\n");
      ```
