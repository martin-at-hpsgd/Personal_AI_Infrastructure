        value: [ "The program keeps running and watches the folder for new images (a file watcher or equivalent), rather than processing the files already there once and exiting", "Resized images are 1024 pixels wide with the height scaled to keep the original aspect ratio, never forced to a fixed 1024x1024 or otherwise distorted", "Every file in STRUCTURE has complete code in CODE, with no stubbed or placeholder function", "At least one test exercises the resize logic and would fail if the aspect ratio were not kept", "Takeaways and suggestions are specific to this folder-watching image resizer, not generic advice" ]
        reference: "A watch-folder resizer: a watcher (fs.watch, chokidar, watchdog or similar) that handles each new image once, waits for the file to finish writing, resizes to width 1024 with height auto (aspect kept), writes to an output folder so it does not re-trigger on its own output, with the core resize separate from the watcher and tested."
