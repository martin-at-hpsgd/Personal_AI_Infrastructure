set -g default-shell /bin/zsh
set -g default-command '/bin/zsh -l'
set -g default-terminal tmux-256color
set -g status off
set -g prefix None
set -g prefix2 None
set -g mouse on
set -sg escape-time 0
set -g history-limit 20000
set -g destroy-unattached off
set -g exit-empty on
set -g set-titles off
set -g allow-rename off
set -g focus-events on
set -as terminal-features ',xterm-256color:RGB:sync'
# Mouse-drag selection copies to the macOS clipboard and exits copy-mode, so highlighting text in the
# Pulse terminal lands on the system clipboard the way it does in kitty. Applies to both key tables
# because a fresh pane starts in emacs-style copy-mode until a vi motion switches it.
set -g mode-keys vi
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# A single click clears any selection without leaving a dangling highlight.
bind -T copy-mode    MouseDown1Pane    send -X clear-selection
bind -T copy-mode-vi MouseDown1Pane    send -X clear-selection
