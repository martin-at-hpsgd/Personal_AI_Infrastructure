# Fabric CodingProject — a complete starter project in the nine upstream
# sections (PROJECT, SUMMARY, STEPS, STRUCTURE, DETAILED EXPLANATION, CODE,
# SETUP, TAKEAWAYS, SUGGESTIONS). The regex asserts pin the nine sections in
# order, a README.md file and quoted heredocs in SETUP; contains asserts pin
# the literal facts each prompt fixes; the judged asserts carry what code
# cannot: the code does the job, every requirement is kept, the project is
# secure and the sections agree. Shape and parsing are also checked by
# Tools/CodingProjectCheck.ts. Synthetic inline fixtures only: every host and
# name below is fictional.
name: fabric-codingproject
type: capability
pass_threshold: 0.75
trials: 3
subject_timeout_ms: 420000
system_prompt_file: "~/.claude/skills/Fabric/Intents/CodingProject.md"
cases:
  - id: bare_idea_does_the_whole_job
    prompt: "create_coding_project: a command-line tool that watches a folder and resizes every new image dropped into it to 1024 pixels wide, keeping the aspect ratio"
    # SYNTHETIC ADVERSARIAL FIXTURE: all nine sections, matching file lists, a
    # README, quoted heredocs and parseable code, so every code check passes.
    # But it never watches the folder (one readdir pass over files already
    # there), and fit: "fill" squashes every image to 1024x1024, breaking the
    # aspect ratio the prompt asked to keep; its test checks only the width.
    adversarial_output: |
      ## PROJECT

      A Node command-line tool that resizes the images in a folder to 1024 pixels wide.

      ## SUMMARY

      `src/cli.ts` reads the folder path from the command line and hands each image to `src/resize.ts`, which uses `sharp` to write a resized copy into an `out/` folder. TypeScript on Node, because `sharp` is the fastest maintained image library there. Output goes to `out/` by default; set `OUT_DIR` to change it.

      ## STEPS

      1. Run the SETUP script in an empty directory.
      2. Run `npm test` to check the resizer.
      3. Run `npx tsx src/cli.ts ./photos` to resize the folder.

      ## STRUCTURE

      ```text
      img-shrink/
      ├── src/
      │   ├── cli.ts
      │   └── resize.ts
      ├── test/
      │   └── resize.test.ts
      ├── README.md
      └── package.json
      ```

      ## DETAILED EXPLANATION

      - `src/cli.ts`: Reads the folder argument and resizes each image in it.
      - `src/resize.ts`: Resizes one image to 1024 pixels with sharp.
      - `test/resize.test.ts`: Checks the resized image has the target size.
      - `README.md`: Install, usage and configuration instructions.
      - `package.json`: Dependencies and run scripts.

      ## CODE

      ### `src/resize.ts`

      Resizes one image file and writes the result to the output folder.

      ```ts
      import sharp from "sharp";
      import { basename, join } from "node:path";

      // Fixed target so every output image has the same size.
      export const TARGET = 1024;

      export async function resizeOne(input: string, outDir: string): Promise<string> {
        const dest = join(outDir, basename(input));
        await sharp(input).resize({ width: TARGET, height: TARGET, fit: "fill" }).toFile(dest);
        return dest;
      }
      ```

      ### `src/cli.ts`

      Resizes every image already in the folder named on the command line.

      ```ts
      import { mkdirSync, readdirSync } from "node:fs";
      import { join } from "node:path";
      import { resizeOne } from "./resize.ts";

      const dir = process.argv[2];
      if (!dir) {
        console.error("usage: img-shrink <folder>");
        process.exit(2);
      }
      const outDir = process.env.OUT_DIR ?? join(dir, "out");
      mkdirSync(outDir, { recursive: true });
      // Only common image extensions are handed to sharp.
      for (const name of readdirSync(dir)) {
        if (/\.(jpe?g|png|webp)$/i.test(name)) console.log(await resizeOne(join(dir, name), outDir));
      }
      ```

      ### `test/resize.test.ts`

      Checks that a resized image comes out at the target size.

      ```ts
      import { test } from "node:test";
      import assert from "node:assert/strict";
      import sharp from "sharp";
      import { mkdtempSync } from "node:fs";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { resizeOne, TARGET } from "../src/resize.ts";

      test("output is the target size", async () => {
        const dir = mkdtempSync(join(tmpdir(), "shrink-"));
        const src = join(dir, "in.png");
        await sharp({ create: { width: 3000, height: 2000, channels: 3, background: "#888" } }).png().toFile(src);
        const out = await resizeOne(src, mkdtempSync(join(tmpdir(), "out-")));
        const meta = await sharp(out).metadata();
        assert.equal(meta.width, TARGET);
      });
      ```

      ### `README.md`

      Explains install, usage and configuration.

      ````markdown
      # img-shrink

      Resizes the images in a folder to 1024 pixels wide. Needs Node 22.

      ## Usage

      ```bash
      npx tsx src/cli.ts ./photos
      ```

      Set `OUT_DIR` to choose where resized copies go.
      ````

      ### `package.json`

      Declares the dependencies and scripts.

      ```json
      {
        "name": "img-shrink",
        "version": "0.1.0",
        "type": "module",
        "scripts": { "test": "tsx --test test/resize.test.ts" },
        "dependencies": { "sharp": "^0.33.5" },
        "devDependencies": { "tsx": "^4.19.2" }
      }
      ```

      ## SETUP

      ````bash
      set -euo pipefail
      mkdir -p img-shrink/src img-shrink/test
      cd img-shrink
      cat > src/resize.ts <<'EOF'
      import sharp from "sharp";
      import { basename, join } from "node:path";

      // Fixed target so every output image has the same size.
      export const TARGET = 1024;

      export async function resizeOne(input: string, outDir: string): Promise<string> {
        const dest = join(outDir, basename(input));
        await sharp(input).resize({ width: TARGET, height: TARGET, fit: "fill" }).toFile(dest);
        return dest;
      }
      EOF
      cat > src/cli.ts <<'EOF'
      import { mkdirSync, readdirSync } from "node:fs";
      import { join } from "node:path";
      import { resizeOne } from "./resize.ts";

      const dir = process.argv[2];
      if (!dir) {
        console.error("usage: img-shrink <folder>");
        process.exit(2);
      }
      const outDir = process.env.OUT_DIR ?? join(dir, "out");
      mkdirSync(outDir, { recursive: true });
      // Only common image extensions are handed to sharp.
      for (const name of readdirSync(dir)) {
        if (/\.(jpe?g|png|webp)$/i.test(name)) console.log(await resizeOne(join(dir, name), outDir));
      }
      EOF
      cat > test/resize.test.ts <<'EOF'
      import { test } from "node:test";
      import assert from "node:assert/strict";
      import sharp from "sharp";
      import { mkdtempSync } from "node:fs";
      import { tmpdir } from "node:os";
      import { join } from "node:path";
      import { resizeOne, TARGET } from "../src/resize.ts";

      test("output is the target size", async () => {
        const dir = mkdtempSync(join(tmpdir(), "shrink-"));
        const src = join(dir, "in.png");
        await sharp({ create: { width: 3000, height: 2000, channels: 3, background: "#888" } }).png().toFile(src);
        const out = await resizeOne(src, mkdtempSync(join(tmpdir(), "out-")));
        const meta = await sharp(out).metadata();
        assert.equal(meta.width, TARGET);
      });
      EOF
      cat > README.md <<'EOF'
      # img-shrink

      Resizes the images in a folder to 1024 pixels wide. Needs Node 22.

      ## Usage

      ```bash
      npx tsx src/cli.ts ./photos
      ```

      Set `OUT_DIR` to choose where resized copies go.
      EOF
      cat > package.json <<'EOF'
      {
        "name": "img-shrink",
        "version": "0.1.0",
        "type": "module",
        "scripts": { "test": "tsx --test test/resize.test.ts" },
        "dependencies": { "sharp": "^0.33.5" },
        "devDependencies": { "tsx": "^4.19.2" }
      }
      EOF
      npm install
      npm test
      ````

      ## TAKEAWAYS

      1. A fixed target size keeps every output consistent.
      2. Writing copies to `out/` leaves the originals untouched.

      ## SUGGESTIONS

      - Add a `--width` flag for other target sizes.
      - Skip images that are already smaller than the target.
