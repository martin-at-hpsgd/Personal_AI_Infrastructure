# LifeOS Kitty Terminal Config — the kitty layer under herdr: theme, fonts, key passthrough, remote socket
# Optional: LifeOS works in any terminal. This is the reference setup the
# docs describe (DOCUMENTATION/Terminal/Helm.md).

# Window Management
remember_window_size no
initial_window_width 75c
initial_window_height 65c
window_padding_width 16 16 32 16
confirm_os_window_close 0
enabled_layouts splits,tall,fat,horizontal,vertical,grid,stack

# Tab Bar Styling — a top strip for windows where herdr is not running; the
# `herdr` shell wrapper hides it (TabBar.ts hide-on) while a herdr client runs
tab_bar_edge top
# custom = tab_bar.py: top-edge tabs share the full window width dynamically
tab_bar_style custom
tab_bar_min_tabs 1
# Do NOT set tab_title_max_length here — setting it in the conf broke bar
# rendering on reload (kitty 0.48.2).
tab_title_template "{((bell_symbol + activity_symbol) + ' ') if (bell_symbol or activity_symbol) else ''}{title}"
active_tab_foreground   #c0caf5
active_tab_background   #1244B3
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #1a1b26
inactive_tab_font_style normal

# Shell Integration
shell_integration enabled
shell zsh

# Theme - Tokyo Night Storm with custom colors
background #24283b
foreground #c0caf5
selection_background #775095
selection_foreground #c0caf5

# Cursor
cursor #bb9af7
cursor_text_color #24283b
cursor_shape block
cursor_blink_interval 0

# Colors - Tokyo Night Storm palette
color0  #1a1b26
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Fonts — install Hack Nerd Font first: brew install --cask font-hack-nerd-font
font_family Hack Nerd Font
bold_font Hack Nerd Font Bold
italic_font Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size 16.0
font_features +liga
disable_ligatures never
text_composition_strategy 1.0 20

# Keyboard Shortcuts
# Config reload
map shift+cmd+r load_config_file

# Tab management
# On close, focus the next tab down/right instead of the last-used one.
tab_switch_strategy right
# Herdr passthrough: while a window runs herdr (user var in_herdr=1, set by the
# `herdr` zsh wrapper) these Helm chords fall through to herdr, whose config
# binds the same keys. Outside herdr they run the plain kitty action, so a bare
# kitty window stays usable with the same motions.
#
# The empty maps come FIRST and are load-bearing. kitty keeps its built-in default
# for a key alongside a conditional map, and an unconditional default always matches:
# inside herdr the conditional map is skipped and the default (cmd+n new OS window,
# cmd+t new tab, cmd+w close window, cmd+k clear, cmd+h hide) fires instead of the
# key reaching herdr. An empty action is the last match there and passes the key on.
map cmd+t
map cmd+w
map cmd+n
map cmd+shift+w
map cmd+shift+l
map cmd+shift+j
map ctrl+h
map ctrl+l
map ctrl+shift+h
map ctrl+shift+l
map cmd+h
map cmd+j
map cmd+k
map cmd+l
map ctrl+cmd+h
map ctrl+cmd+j
map ctrl+cmd+k
map ctrl+cmd+l
map cmd+shift+[
map cmd+shift+]
map --when-focus-on "not var:in_herdr=1" cmd+t new_tab
map --when-focus-on "not var:in_herdr=1" cmd+w close_tab
# Herdr sessions (workspaces): cmd+t new, cmd+shift+w close, ctrl+h/ctrl+l previous/next; cmd+n is a new herdr tab.
# Outside herdr these keep kitty's own OS-window defaults.
map --when-focus-on "not var:in_herdr=1" cmd+n new_os_window
map --when-focus-on "not var:in_herdr=1" cmd+shift+w close_os_window
map ctrl+t next_tab

# Launch a new DA session (new tab + run your assistant's launch alias, e.g. 'k')
# Adjust "k" to whatever command starts your assistant.
map cmd+shift+n launch --type=tab --cwd=current zsh -ic "k"

# Window/Split management - Create new panes with Cmd+Shift
# Right/Left use vsplit (vertical divider = side by side)
# Down/Up use hsplit (horizontal divider = stacked)
map --when-focus-on "not var:in_herdr=1" cmd+shift+l launch --location=vsplit --cwd=current
map --when-focus-on "not var:in_herdr=1" cmd+shift+j launch --location=hsplit --cwd=current

# Navigate between tabs with Ctrl+H/L
map --when-focus-on "not var:in_herdr=1" ctrl+h previous_tab
map --when-focus-on "not var:in_herdr=1" ctrl+l next_tab
# macOS-standard tab chords; inside herdr they switch herdr tabs.
map --when-focus-on "not var:in_herdr=1" cmd+shift+[ previous_tab
map --when-focus-on "not var:in_herdr=1" cmd+shift+] next_tab

# Hide / show the tab bar — TabBar.ts (needs bun: https://bun.sh)
map ctrl+cmd+b launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts hide"

# Move tabs left/right (reorder position)
map --when-focus-on "not var:in_herdr=1" ctrl+shift+h move_tab_backward
map --when-focus-on "not var:in_herdr=1" ctrl+shift+l move_tab_forward

# Navigate between panes (vim-style) - using Cmd
map --when-focus-on "not var:in_herdr=1" cmd+h neighboring_window left
map --when-focus-on "not var:in_herdr=1" cmd+j neighboring_window down
map --when-focus-on "not var:in_herdr=1" cmd+k neighboring_window up
map --when-focus-on "not var:in_herdr=1" cmd+l neighboring_window right

# Resize windows - using Ctrl+Cmd (native kitty resize)
map --when-focus-on "not var:in_herdr=1" ctrl+cmd+h resize_window narrower
map --when-focus-on "not var:in_herdr=1" ctrl+cmd+l resize_window wider
map --when-focus-on "not var:in_herdr=1" ctrl+cmd+k resize_window taller
map --when-focus-on "not var:in_herdr=1" ctrl+cmd+j resize_window shorter

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Mouse
hide_window_decorations titlebar-only
mouse_hide_wait 0

# Background
# Note: background_opacity must be 1.0 for background images to work properly
# Use background_tint to control image opacity instead
background_opacity 1.0
dynamic_background_opacity no
background_blur 0

# Background Image (optional). Set background_image in your local overrides file
# (see the globinclude at the end), never here: this file ships publicly.
# background_image ~/terminal-background.jpg
# Use 'cscaled' to scale and center, preserving aspect ratio
background_image_layout cscaled
# Tint: Higher value = brighter image (1.0 = full brightness)
background_tint 0.96

# Selection/Clipboard
copy_on_select yes
strip_trailing_spaces smart
# Programs may write the clipboard; reading it asks first (kitty default). Silent reads let any remote host or catted file exfiltrate it via OSC 52.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# macOS Specific
macos_option_as_alt yes
macos_titlebar_color background
macos_traditional_fullscreen no
macos_show_window_title_in all
macos_custom_beam_cursor yes
macos_thicken_font 0.75

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# URLs
url_style curly
open_url_with default
detect_urls yes
# Open links even while a TUI (Claude Code, herdr) holds the mouse grab.
# Without these, the app eats the click and the URL never reaches kitty.
# Plain click too: herdr holds the grab in every pane, and its own opener is ctrl+click only.
# The click still reaches herdr, so pane focus and the sidebar keep working.
mouse_map left click grabbed mouse_handle_click link
mouse_map cmd+left click grabbed,ungrabbed mouse_handle_click link
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left click grabbed,ungrabbed mouse_handle_click link

url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

# Special key mappings for newline
map shift+enter send_text all \n
# Ctrl+Enter for ZSH autosuggestion completion
map ctrl+enter send_text all \x1b[27;5;13~

# Window borders and margins — thin frame + gaps between panes (the tiling look)
# Note: non-zero window_margin_width disables draw_minimal_borders, so every
# pane gets a full frame. That is intentional.
window_border_width 1pt
window_margin_width 2
draw_minimal_borders yes
active_border_color #1244B3
inactive_border_color #414868
bell_border_color #e0af68

# NOTE: window_title_template stays at kitty's DEFAULT — the LifeOS tab-title
# pipeline depends on default title composition (bell/activity/progress + title).

# Bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# Advanced — remote control lets LifeOS hooks paint tab titles/colors
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Clear the green "done" tab stamp on first view (done-cleared-on-view)
watcher ${HOME}/.config/kitty/cairn_clear_watcher.py
update_check_interval 0
startup_session none
allow_hyperlinks yes

# Personal overrides (background image, fonts) live in your private USER tree, read last
# so they win. No file there means nothing is included.
include ${HOME}/.config/LIFEOS/USER/CUSTOMIZATIONS/HELM/kitty.local.conf
