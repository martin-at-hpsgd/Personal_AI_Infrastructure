<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#050b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Herdr Agents</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  @font-face { font-family: 'concourse-t3'; src: url('/fonts/concourse-t3.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'advocate-c41'; src: url('/fonts/advocate-c41.woff') format('woff'); font-display: swap; }
  :root {
    --ground: #050b17; --surface-1: #0a1528; --surface-2: #0e1d33; --surface-3: #162c48;
    --line-1: #1b304d; --line-2: #294567; --ink-1: #eff7ff; --ink-2: #b0c4dd; --ink-3: #829dbb;
    --accent: #258bff; --ok: #4ADE80; --warn: #FBBF24; --err: #F87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink-1);
    font-family: 'concourse-t3', ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-1);
    border-bottom: 1px solid var(--line-1); min-height: 52px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--ink-3); font-size: 12px; font-family: 'advocate-c41', ui-monospace, monospace; }
  button { font: inherit; color: var(--ink-1); background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
  button:active { background: var(--surface-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { border-color: var(--warn); color: var(--warn); }

  #list { flex: 1; overflow-y: auto; padding: 12px max(16px, calc((100% - 760px) / 2)) 24px; display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--surface-2);
    border: 1px solid var(--line-2); border-radius: 14px; text-decoration: none; color: inherit; }
  .card:active { background: var(--surface-3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3); }
  .s-blocked .dot { background: var(--err); box-shadow: 0 0 10px var(--err); }
  .s-working .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .s-done .dot { background: var(--ok); }
  .card .body { min-width: 0; flex: 1; }
  .card .title { font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2);
    font-family: 'advocate-c41', ui-monospace, monospace; }
  .s-blocked .chip.state { border-color: var(--err); color: var(--err); }
  .s-working .chip.state { border-color: var(--accent); color: #9cc9ff; }
  .chip.open { border-color: var(--warn); color: var(--warn); }
  .section { color: var(--ink-3); font-size: 12px; letter-spacing: .06em; margin: 8px 2px 0; }
  .empty { color: var(--ink-2); text-align: center; padding: 40px 16px; line-height: 1.5; }

  #term-view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #term-wrap { flex: 1; min-height: 0; padding: 6px 6px 0; background: #000; }
  #term { width: 100%; height: 100%; }
  .status-line { padding: 6px 16px; font-size: 12px; color: var(--ink-2); background: var(--surface-1);
    border-top: 1px solid var(--line-1); display: flex; gap: 8px; align-items: center; }
  .status-line .mode { font-family: 'advocate-c41', ui-monospace, monospace; }
  .mode.control { color: var(--warn); }
  #controls { display: none; flex-direction: column; gap: 8px; padding: 8px 10px 10px; background: var(--surface-1);
    border-top: 1px solid var(--line-1); }
  #keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #keys button { padding: 6px 0; min-height: 38px; font-size: 13px; font-family: 'advocate-c41', ui-monospace, monospace; }
  .compose { display: flex; gap: 6px; align-items: flex-end; }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; font-size: 16px; color: var(--ink-1);
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 10px;
    min-height: 42px; max-height: 30dvh; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <button id="back" class="hidden" aria-label="Back to agents">‹</button>
    <div style="flex:1;min-width:0">
      <h1 id="title">Herdr Agents</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <button id="mode-btn" class="hidden"></button>
  </header>

  <main id="list" aria-live="polite"></main>

  <section id="term-view">
    <div id="term-wrap"><div id="term"></div></div>
    <div class="status-line"><span class="mode" id="mode-label"></span><span id="conn"></span></div>
    <div id="controls">
      <div id="keys">
        <button data-key="esc">esc</button>
        <button data-key="ctrl-c">^C</button>
        <button data-key="tab">tab</button>
        <button data-key="shift-tab">⇧tab</button>
        <button data-key="enter">⏎</button>
        <button data-key="left">←</button>
        <button data-key="up">↑</button>
        <button data-key="down">↓</button>
        <button data-key="right">→</button>
        <button id="refit">fit</button>
      </div>
      <div class="compose">
        <textarea id="say" rows="1" placeholder="Type or dictate…" autocapitalize="sentences"></textarea>
        <button id="insert" title="Insert without pressing enter">Insert</button>
        <button id="send" class="primary">Send</button>
      </div>
    </div>
  </section>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $("list"), termView = $("term-view"), controls = $("controls");
  const title = $("title"), subtitle = $("subtitle"), back = $("back"), modeBtn = $("mode-btn");
  const modeLabel = $("mode-label"), conn = $("conn"), say = $("say");
  let agents = [], pollTimer = null, ws = null, term = null, fit = null;
  let current = null, mode = "observe", wantOpen = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STATE_WORD = { blocked: "Needs you", working: "Working", done: "Done", idle: "Idle", unknown: "Unknown" };

  async function loadAgents() {
    try {
      const r = await fetch("/api/agents", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      agents = (await r.json()).agents || [];
      if (!current) renderList();
    } catch (e) {
      if (!current) subtitle.textContent = "Can't reach herdr (" + e.message + ")";
    }
  }

  function renderList() {
    const needs = agents.filter((a) => a.status === "blocked").length;
    const working = agents.filter((a) => a.status === "working").length;
    subtitle.textContent = agents.length
      ? `${agents.length} agents · ${needs} need you · ${working} working`
      : "No agents running";
    if (!agents.length) {
      list.innerHTML = '<div class="empty">No herdr agents are running on the Mac right now.</div>';
      return;
    }
    let html = "", lastGroup = "";
    for (const a of agents) {
      const group = a.status === "blocked" ? "NEEDS YOU" : a.status === "working" ? "WORKING" : "QUIET";
      if (group !== lastGroup) { html += `<div class="section">${group}</div>`; lastGroup = group; }
      html += `<a class="card s-${esc(a.status)}" href="#/p/${encodeURIComponent(a.paneId)}">
        <span class="dot"></span>
        <span class="body">
          <div class="title">${esc(a.title)}</div>
          <div class="meta">
            <span class="chip state">${esc(a.label || STATE_WORD[a.status])}</span>
            <span class="chip">${esc(a.agent)}</span>
            ${a.open ? `<span class="chip open">${esc(a.open)}</span>` : ""}
            <span class="chip">${esc(a.paneId)}</span>
          </div>
        </span></a>`;
    }
    list.innerHTML = html;
  }

  function ensureTerm() {
    if (term) return;
    const small = window.innerWidth < 600;
    term = new Terminal({
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      fontSize: small ? 11 : 13, cursorBlink: false, scrollback: 2000, convertEol: false,
      theme: { background: "#000000", foreground: "#eff7ff", cursor: "#258bff", selectionBackground: "#294567" },
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open($("term"));
    // xterm also answers the pane's own queries (device attributes, cursor position,
    // status reports) through onData; those replies must not be typed into the agent.
    const REPLY = /^(\x1b\[[?>=]?[\d;]*[cRn]|\x1b\[\d+;\d+R|\x1bP[\s\S]*\x1b\\|\x1b\][\s\S]*(\x07|\x1b\\))$/;
    term.onData((d) => { if (mode === "control" && !REPLY.test(d)) sendMsg({ t: "input", text: d }); });
  }

  function dims() {
    try { fit.fit(); } catch {}
    return { cols: term.cols, rows: term.rows };
  }

  function sendMsg(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function setMode(m) {
    mode = m;
    modeLabel.textContent = m === "control" ? "● Controlling" : "○ Watching";
    modeLabel.className = "mode " + m;
    modeBtn.textContent = m === "control" ? "Release" : "Take control";
    modeBtn.className = m === "control" ? "warn" : "primary";
    controls.style.display = m === "control" ? "flex" : "none";
    term.options.disableStdin = m !== "control";
  }

  function connect(target, m) {
    if (ws) { wantOpen = false; ws.close(); ws = null; }
    setMode(m);
    term.reset();
    const d = dims();
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const u = `${proto}//${location.host}/ws?target=${encodeURIComponent(target)}&mode=${m}&cols=${d.cols}&rows=${d.rows}`;
    conn.textContent = "Connecting…";
    const sock = new WebSocket(u);
    sock.binaryType = "arraybuffer";
    ws = sock; wantOpen = true;
    sock.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        const msg = JSON.parse(ev.data);
        if (msg.t === "open") conn.textContent = "Live";
        if (msg.t === "closed") conn.textContent = msg.reason === "idle"
          ? "Control released after 10 min idle" : "Stream closed (" + msg.reason + ")";
        return;
      }
      term.write(new Uint8Array(ev.data));
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null;
      if (conn.textContent === "Live" || conn.textContent === "Connecting…") conn.textContent = "Disconnected";
      if (mode === "control") setMode("observe");
    };
  }

  function openPane(paneId) {
    const a = agents.find((x) => x.paneId === paneId);
    current = paneId;
    list.style.display = "none";
    termView.style.display = "flex";
    back.classList.remove("hidden");
    modeBtn.classList.remove("hidden");
    title.textContent = a ? a.title : paneId;
    subtitle.textContent = a ? `${a.agent} · ${paneId}` : paneId;
    ensureTerm();
    requestAnimationFrame(() => connect(paneId, "observe"));
  }

  function closePane() {
    current = null;
    if (ws) { const s = ws; ws = null; s.close(); }
    termView.style.display = "none";
    list.style.display = "flex";
    back.classList.add("hidden");
    modeBtn.classList.add("hidden");
    title.textContent = "Herdr Agents";
    renderList();
    loadAgents();
  }

  function route() {
    const m = location.hash.match(/^#\/p\/(.+)$/);
    if (m) openPane(decodeURIComponent(m[1])); else if (current) closePane();
  }

  back.onclick = () => { location.hash = ""; };
  modeBtn.onclick = () => { if (current) connect(current, mode === "control" ? "observe" : "control"); };
  $("keys").addEventListener("click", (e) => {
    const k = e.target.closest("button[data-key]");
    if (k) sendMsg({ t: "key", key: k.dataset.key });
  });
  $("refit").onclick = () => { if (mode === "control") sendMsg({ t: "resize", ...dims() }); };
  $("insert").onclick = () => { if (say.value) { sendMsg({ t: "input", text: say.value }); say.value = ""; say.style.height = ""; } };
  $("send").onclick = () => {
    if (say.value) sendMsg({ t: "input", text: say.value });
    setTimeout(() => sendMsg({ t: "key", key: "enter" }), 60);
    say.value = ""; say.style.height = "";
  };
  say.addEventListener("input", () => { say.style.height = "auto"; say.style.height = say.scrollHeight + "px"; });

  let resizeT = null;
  window.addEventListener("resize", () => {
    if (!current || !term) return;
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (mode === "control") sendMsg({ t: "resize", ...dims() });
      else connect(current, "observe");
    }, 250);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && mode === "control" && current) connect(current, "observe");
  });
  window.addEventListener("pagehide", () => { if (ws) ws.close(); });
  window.addEventListener("hashchange", route);

  loadAgents().then(route);
  pollTimer = setInterval(loadAgents, 3000);
})();
</script>
</body>
</html>
